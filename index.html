<!DOCTYPE html>

            background: #f2f4f8;

        h1 {

        }

        .container {
            display: flex;
            justify-content: center;
            gap: 30px;

            margin-top: 40px;
        }

        .card {
            background: white;
            width: 280px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccc;
        }

        .card h2 {
            color: #2563eb;
        }

        .card a {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 15px;
        }

        .card a:hover {
            background: #1745a0;
        }
    </style>
</head>

<body>
